[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Plus Jakarta Sans:https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
headingFontWeights = [800, 700, 700, 600, 600, 600]
baseRadius = "12px"
buttonRadius = "10px"
showWidgetBorder = true
showSidebarBorder = true
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"]

[theme.light]
primaryColor = "#4f46e5"
backgroundColor = "#f6f6fb"
secondaryBackgroundColor = "#ececf5"
textColor = "#1c1a2e"
borderColor = "#e1e1ec"

[theme.light.sidebar]
backgroundColor = "#ffffff"

[theme.dark]
primaryColor = "#8f8cf9"
backgroundColor = "#0e0f1d"
secondaryBackgroundColor = "#1b1c31"
textColor = "#ececf6"
borderColor = "#2b2c47"
chartCategoricalColors = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#008300", "#9085e9", "#e66767"]

[theme.dark.sidebar]
backgroundColor = "#131427"
